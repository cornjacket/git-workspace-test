name: Auto-merge status branches

# Fast-forwards the side branches the daily status routine pushes
# (`auto/status-YYYY-MM-DD`) onto main, then deletes them.
#
# This exists because the GitHub App identity a Claude remote routine runs under
# cannot push to the default branch. The routine therefore pushes a side branch
# and this workflow — running as github-actions[bot], which can — lands it.
#
# MACHINERY: regenerated by create-git-workspace's update.sh. Do not edit.

on:
  push:
    branches:
      - 'auto/status-*'

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward merge into main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          # --ff-only on purpose: the routine branches from origin/main, so a
          # non-fast-forward means main moved underneath it. Failing loudly is
          # correct — a merge commit here would silently interleave a machine
          # rollup with your own work.
          git merge --ff-only "origin/$BRANCH"
          git push origin main
          git push origin --delete "$BRANCH"

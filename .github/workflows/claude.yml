name: Claude Code

# Lets you mention @claude in an issue or a PR review comment on this workspace
# repo and have Claude act on it. Independent of the daily status routine —
# that one runs on a schedule and never touches this workflow.
#
# REQUIRES a repository secret: CLAUDE_CODE_OAUTH_TOKEN. Without it the workflow
# exists but every run fails at the action step. Setting it is a manual step —
# see the workspace README.
#
# MACHINERY: regenerated by create-git-workspace's update.sh. Do not edit.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
